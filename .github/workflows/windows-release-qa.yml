name: Windows release QA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to build and verify (for example v1.2.0)
        required: true
        type: string
      source_ref:
        description: Exact source commit or ref to test
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  installed-app:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONUTF8: '1'
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Validate source version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag such as v1.2.0' }
          $source = Get-Content version.py -Raw
          $expected = $env:RELEASE_TAG.Substring(1)
          if ($source -notmatch ('__version__\s*=\s*"' + [regex]::Escape($expected) + '"')) { throw 'Source version does not match the requested tag' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Prepare installer tools
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsis 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $env:ProgramFiles '7-Zip') | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Windows installer from checked-out source
        shell: pwsh
        run: |
          python packaging/build_windows.py *> windows-build.log
          $buildExit = $LASTEXITCODE
          Get-Content windows-build.log
          if ($buildExit -ne 0) { throw "Windows installer build failed with $buildExit" }
      - name: Install the built application
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem packaging/dist -Filter '*-Windows-x64-Setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with $($setup.ExitCode)" }
          $gs = Join-Path $env:LOCALAPPDATA 'Programs\CometForge\ghostscript\bin\gswin64c.exe'
          if (!(Test-Path $gs)) { throw 'Bundled Ghostscript is missing' }
          "COMETFORGE_GHOSTSCRIPT=$gs" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test PDF engine and desktop launch contracts
        run: |
          python scripts/test_windows_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_v1_1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_hd_render.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_page_layout.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_options_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test interface controllers
        run: node --test scripts/test_guided_ui.cjs scripts/test_comparison_ui.cjs scripts/test_layout_ui.cjs scripts/test_themes_ui.cjs scripts/test_motion_ui.cjs
      - name: Launch installed desktop app and check for console windows
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          python scripts/smoke_windows_app.py --version "$version"
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop application smoke test failed' }
      - name: Checksum the tested installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem packaging/dist -Filter '*-Windows-x64-Setup.exe'
          $checksum = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($checksum.Hash.ToLower())  $($installer.Name)" | Out-File -Encoding ascii -FilePath "packaging/dist/SHA256SUMS-$env:RELEASE_TAG-Windows.txt"
      - name: Retain the tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tested-windows-installer-${{ inputs.release_tag }}
          path: |
            packaging/dist/*-Windows-x64-Setup.exe
            packaging/dist/SHA256SUMS-*-Windows.txt
          if-no-files-found: error
      - name: Retain desktop application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-application-log
          path: |
            windows-build.log
            ~/AppData/Local/CometForge/data/launcher.log
            ~/AppData/Local/CometForge/data/desktop-smoke-result.json
          if-no-files-found: ignore
